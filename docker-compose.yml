version: '3.8'

services:
  backend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - APP_NAME=West and Star Academy
      - APP_THEME_COLOR=green
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - school-network

  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - school-network

networks:
  school-network:
    driver: bridge

volumes:
  backend:
  frontend:
